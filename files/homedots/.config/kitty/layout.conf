enabled_layouts grid,tall,vertical
window_margin_width 2 4
#single_window_margin_width 3 4.5
window_padding_width 2 4
#single_window_padding_width 4 8
hide_window_decorations yes
placement_strategy center

window_logo_path pushendonut.gif
window_logo_position bottom-right
window_logo_alpha 0.3
window_logo_scale 15

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

tab_activity_symbol "!"
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol} {fmt.fg.tag}{tab.last_focused_progress_percent}{title[:50]}"
