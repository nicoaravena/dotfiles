[Seat:*]
allow-guest=false
backup-logs=false
greeter-wrapper=/usr/share/lib/lightdm/lightdm-greeter-session
guest-wrapper=/usr/lib/lightdm/lightdm-guest-session
xserver-command=X -core
greeter-session=lightdm-slick-greeter
user-session=cinnamon
session-wrapper=/etc/lightdm/Xsession
#display-setup-script=xrandr --output HDMI-1-0 --primary
display-setup-script=/usr/share/lib/lightdm/display-setup
