[Greeter]
background=/usr/share/backgrounds/lightdm/CatTriangles2.jpg
theme-name=Mint-Y-Dark-Purple
icon-theme-name=Papirus-Dark
font-name=FiraCode-Retina 11
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb
cursor-theme-name=Vimix-cursors
activate-numlock=true
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~language;~power
keyboard=onboard
reader=orca
position = 50%,center 50%,center
default-user-image = #avatar-default
screensaver-timeout = 60
a11y-states=contrast;font;keyboard;reader
user-background = false
