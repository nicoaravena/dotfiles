# Disable empty ports to prevent EDID polling
# intel (card0)
Section "Monitor"
    Identifier "DP-1"
    Option "Ignore" "true"
EndSection

Section "Monitor"
    Identifier "DP-2"
    Option "Ignore" "true"
EndSection

Section "Monitor"
    Identifier "HDMI-A-1"
    Option "Ignore" "true"
EndSection

Section "Monitor"
    Identifier "HDMI-A-2"
    Option "Ignore" "true"
EndSection

# nvidia (card1)
Section "Monitor"
    Identifier "DP-3"
    Option "Ignore" "true"
EndSection

Section "Monitor"
    Identifier "DP-4"
    Option "Ignore" "true"
EndSection
